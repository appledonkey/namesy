# Build and deploy Namesy to GitHub Pages (https://appledonkey.github.io/namesy/)
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: "/namesy"
        run: npm run build

      - name: Patch manifest for subpath
        run: |
          MANIFEST="out/manifest.json"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|"start_url":"/"|"start_url":"/namesy/"|g' "$MANIFEST"
            sed -i 's|"/icon|"/namesy/icon|g' "$MANIFEST"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@3
        with:
          path: "out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@4
